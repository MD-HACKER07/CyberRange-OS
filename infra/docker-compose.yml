# CyberRange OS — platform services.
# The per-session vulnerable range is provisioned separately by the
# orchestrator (see docker-compose.range.yml) on isolated networks.
#
# Network isolation (Section 20):
#   - platform : web/api/db/redis  (institution LAN)
#   - llmnet   : ollama/vllm, reachable ONLY from the API/llm-gateway
#   - range networks are created per-session with internal=true (no WAN)
name: cyberrange-os

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgres://cyberrange:${POSTGRES_PASSWORD:-cyberrange}@postgres:5432/cyberrange?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
  LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-llama3.1:8b}
  LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-nomic-embed-text}
  LLM_ALLOW_PUBLIC_IP: "false"
  RANGE_DRIVER: ${RANGE_DRIVER:-docker}
  DOCKER_HOST: unix:///var/run/docker.sock
  WAZUH_URL: ${WAZUH_URL:-https://wazuh-manager:55000}
  WAZUH_USER: ${WAZUH_USER:-wazuh}
  WAZUH_PASSWORD: ${WAZUH_PASSWORD:-}
  SURICATA_EVE_FILE: /var/log/suricata/eve.json
  STORAGE_DIR: /data/storage
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cyberrange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberrange}
      POSTGRES_DB: cyberrange
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberrange"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [platform]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [platform]

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      <<: *common-env
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      # Orchestrator talks to the host Docker daemon to spin up range targets.
      - /var/run/docker.sock:/var/run/docker.sock
      - storage:/data/storage
      - suricata-logs:/var/log/suricata:ro
    networks: [platform, llmnet]
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8080}
    depends_on: [api]
    ports:
      - "3000:3000"
    networks: [platform]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    # GPU passthrough for the production LLM host (comment out on CPU dev):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks: [llmnet]
    restart: unless-stopped

  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    hostname: wazuh-manager
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - wazuh-config:/wazuh-config-mount
    networks: [platform]
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:latest
    # Mirrors the range bridge for real IDS telemetry (set the interface).
    command: ["-i", "eth0"]
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    network_mode: host
    volumes:
      - suricata-logs:/var/log/suricata
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:latest
    environment:
      GUACD_HOSTNAME: guacd
    depends_on: [guacd]
    ports:
      - "8081:8080"
    networks: [platform]
    restart: unless-stopped

  guacd:
    image: guacamole/guacd:latest
    networks: [platform]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [platform]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    networks: [platform]
    restart: unless-stopped

  pgadmin:
    profiles: ["dev"]
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cyberrange.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks: [platform]

volumes:
  pgdata:
  redisdata:
  ollama:
  storage:
  wazuh-config:
  suricata-logs:
  grafanadata:

networks:
  platform:
    driver: bridge
  llmnet:
    driver: bridge
    internal: false
